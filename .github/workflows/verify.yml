name: Verify Lantern Hall
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native:
    name: Native on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: libsdl-org/setup-sdl@v1
        with:
          version: 3.2.28
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release --parallel 4
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - if: runner.os == 'Linux'
        run: bash scripts/test-c.sh

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OpenSpec
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npx --yes @fission-ai/openspec@2.1.0 validate --all --strict --no-interactive
      - name: Build C and SDL3 for the browser
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.20
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash scripts/build-web.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tests
        run: |
          python -m pip install -r tests/requirements.txt
          chrome_bin=$(command -v google-chrome || command -v chromium || true)
          if [[ -n "$chrome_bin" ]]; then
            echo "CHROMIUM=$chrome_bin" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Play through the browser interfaces and network paths
        shell: bash
        run: |
          python -m http.server 8571 --bind 127.0.0.1 --directory dist &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python tests/web_game.py http://127.0.0.1:8571/ --direct
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-hall-web
          path: dist/
          include-hidden-files: true
